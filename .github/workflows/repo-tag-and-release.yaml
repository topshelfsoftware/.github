name: Tag Repository + Create Release

on:
  workflow_call:

jobs:
  tag-repo:
    runs-on: ubuntu-latest

    outputs:
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: read_version
        run: |
          version=$(cat VERSION)
          echo "version=${version}" >> $GITHUB_ENV

      - name: Check if tag already exists
        id: check_tag
        run: |
          git tag -l | xargs -n 1 git tag -d && git fetch --tags  # clear local tags and fetch only remote tags
          if git rev-parse ${{ env.version }} >/dev/null 2>&1; then
            echo "Tag ${{ env.version }} already exists. Skipping next steps."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ env.version }} does not exist. Proceeding with next steps."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Tag and Push
        if: steps.check_tag.outputs.exists == 'false'  # skip if tag already exists
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ env.version }}
          git push origin ${{ env.version }} --no-verify  # skip pre-commit hooks

  create-release:
    needs: tag-repo
    if: needs.tag-repo.outputs.tag_exists == 'false'  # skip if tag already exists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need to clone the full repository history to generate release notes

      - name: Read version from VERSION file
        id: read_version
        run: |
          version=$(cat VERSION)
          echo "version=${version}" >> $GITHUB_ENV

      - name: Get previous tag
        id: get_previous_tag
        run: |
          # Assign empty string if no previous tag is found
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "previous_tag=${previous_tag}" >> $GITHUB_ENV

          if [ -z "$previous_tag" ]; then
            echo "No previous tag found. This is the first tag and release."
          else
            echo "Found previous tag: $previous_tag"
          fi

      - name: Generate release notes and determine prerelease flag
        id: generate_notes
        run: |
          # Get repo URL from Git config
          repo_url=$(git config --get remote.origin.url)

          # Determine commit message range for notes
          if [ -z "${{ env.previous_tag }}" ] || [[ "${{ env.version }}" =~ ^([a-zA-Z])?1\.0\.0.* ]]; then
            notes=$(git log --oneline | cut -d ' ' -f2- | sed 's/^/* /')
          else
            notes=$(git log ${{ env.previous_tag }}..HEAD --oneline | cut -d ' ' -f2- | sed 's/^/* /')
          fi

          # Format the release notes body as a multiline string
          # Also, determine the prerelease flag
          if [[ "${{ env.version }}" =~ ^([a-zA-Z])?0\..* ]]; then
            release_notes="## Pre-Release\n${notes}"
            prerelease=true
          elif [[ "${{ env.version }}" =~ ^([a-zA-Z])?1\.0\.0.* ]]; then
            release_notes="## Initial Release\nThis is the first official release of the project!\n\n## What's Included\n${notes}"
            prerelease=false
          else
            release_notes="## What's Changed\n${notes}"
            prerelease=false
          fi
          echo "prerelease=${prerelease}" >> $GITHUB_OUTPUT

          # Conditionally append full changelog link if a previous tag exists
          if [ -n "${{ env.previous_tag }}" ]; then
            release_notes="${release_notes}\n\n**Full Changelog**: ${repo_url}/compare/${{ env.previous_tag }}...${{ env.version }}"
          fi

          # Write the release notes to the GITHUB_ENV file
          echo "body<<EOF" >> $GITHUB_ENV
          echo -e "$release_notes" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.version }}
          release_name: ${{ env.version }}
          body: ${{ env.body }}
          draft: false
          prerelease: ${{ steps.generate_notes.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
